[project]
name = "frims"
version = "0.1.0"
description = "AI-based detection and classification of industrial fires and persistent thermal sources (SIH 26162 / NTRO)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "rasterio>=1.4",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "osmium>=4.3.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frims"]

[tool.pytest.ini_options]
testpaths = ["tests"]
